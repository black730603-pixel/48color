                    setTimeout(() => {
                        // 1. 觸發高度動畫 (2秒)
                        displayBox.classList.remove('h-12');
                        displayBox.classList.add('h-96'); // 執行動畫到 h-96

                        // 2. *同時*開始輪播
                        rotationInterval = setInterval(() => {
                            const randomColor = colors[Math.floor(Math.random() * colors.length)];
                            updateDisplay(randomColor);
                        }, 70);

                        // 3. 等待 2 秒動畫結束後，才顯示「抽」按鈕
                        setTimeout(() => {
                            document.getElementById('confirm-button-wrapper').style.opacity = '1';
                        }, 2000); // 必須等於 CSS transition 的 duration
                    }, 10); // 短暫延遲以觸發 transition
                });
            }

            // 確定抽籤
            if(confirmButton) {
                confirmButton.addEventListener('click', () => {
                    clearInterval(rotationInterval);
                    document.getElementById('confirm-button-wrapper').style.display = 'none';

                    finalColor = colors[Math.floor(Math.random() * colors.length)];

                    let slowdownTime = 100;
                    const slowDown = () => {
                        const randomColor = colors[Math.floor(Math.random() * colors.length)];
                        updateDisplay(randomColor);
                        
                        slowdownTime *= 1.25;
                        
                        if (slowdownTime < 700) {
                            setTimeout(slowDown, slowdownTime);
                        } else {
                            updateDisplay(finalColor);

                            setTimeout(() => {
                                displayResult(finalColor);
                            }, 500);
                        }
                    };
                    slowDown();
                });
            }

            // 顯示最終結果
            function displayResult(color) {
                step2.classList.add('hidden');
                step3.classList.remove('hidden');
                step3.classList.add('fade-in');

                resultDisplayBox.style.backgroundColor = color.hex; // *** 修改 ***
                resultImageBox.src = color.imageUrl; // *** 只有在這裡才載入圖片 ***
                resultMessage.textContent = `第 ${color.id} 色：${color.name}`; // 已改回您的格式
                
                // --- 籤詩顯示邏輯更新 ---
                fortuneText.innerHTML = ''; // 清空舊內容
                if (Array.isArray(color.fortune)) {
                    // 將陣列中的每一行/每一組詩句，轉換成一個 <p> 標籤
                    const htmlContent = color.fortune.map(line => 
                        `<p class="my-1">${line}</p>` // my-1 增加一點行距
                    ).join('');
                    fortuneText.innerHTML = htmlContent;
                } else {
                    // 備用：如果資料不是陣列，直接顯示
                    fortuneText.innerHTML = `<p>${color.fortune}</p>`;
                }
                // --- 籤詩邏輯結束 ---

                moreInfoButton.href = color.url;
            }

            // 再抽一次
            if (restartButton) {
                restartButton.addEventListener('click', () => {
                    step3.classList.add('hidden');
                    step3.classList.remove('fade-in');
                    step1.classList.remove('hidden');

                    const confirmWrapper = document.getElementById('confirm-button-wrapper');
                    confirmWrapper.style.opacity = '0';
                    confirmWrapper.style.display = 'block';

                    displayBox.style.backgroundColor = ''; // *** 修改 ***
                    colorName.textContent = '';
                    // imageBox.src = ''; // <-- 已移除
                    // imageBox.style.opacity = '0'; // <-- 已移除
                    fortuneText.innerHTML = ''; // 再抽一次時清空籤詩

                    // *** 新增：重置 display-box 的高度 ***
                    displayBox.classList.remove('h-96');
                    displayBox.classList.add('h-12');
                });
            }
        });
    </script>
</body>
</html>
